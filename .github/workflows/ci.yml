name: Project checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check data, grader and development episodes
        run: make check
      - name: Check browser JavaScript syntax
        run: |
          node --check src/genesis_fintech/web/static/app.js
          node --check src/genesis_fintech/web/static/samples.js
      - name: Prepare locked build dependency
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r requirements-build.lock
      - name: Build twice and verify clean offline installation
        run: |
          python scripts/build_release.py --output dist/release
          python scripts/build_release.py --output dist/repeat
          cmp dist/release/SHA256SUMS dist/repeat/SHA256SUMS
          python scripts/verify_release.py dist/release --full-check
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-release
          path: dist/release/
          if-no-files-found: error
  isolated-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build minimal policy image
        run: docker build -f docker/worker.Dockerfile -t genesis-audit-worker:0.5.0 .
      - name: Test actual container isolation and complete episode
        env:
          GENESIS_RUN_DOCKER_TESTS: "1"
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_container.py -v
      - name: Generate and verify frozen public corpus
        env:
          PYTHONPATH: src
        run: |
          python -m genesis_fintech generate-dataset --spec configs/dataset.json --output artifacts/ci-corpus
          cmp artifacts/ci-corpus/public-index.json datasets/public-v1.index.json
      - name: Evaluate all stored episodes in containers and repeat
        env:
          PYTHONPATH: src
        run: python -m genesis_fintech evaluate-dataset artifacts/ci-corpus --output artifacts/ci-evaluation --replay
      - name: Print measured application resources
        run: python -c 'import json; print(json.dumps(json.load(open("artifacts/ci-evaluation/report.json"))["resources"], indent=2))'
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-evaluation
          path: artifacts/ci-evaluation/
          if-no-files-found: error
