[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-fintech-env"
version = "0.1.0"
description = "Scaffold for a reproducible financial-audit RL environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
genesis-fintech = "genesis_fintech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
