[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-fintech-env"
version = "0.4.0"
description = "Reproducible synthetic financial-audit environment and baseline benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
genesis-fintech = "genesis_fintech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"genesis_fintech.web" = ["static/*"]
